<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bill</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      color: #1a2fd0;
      margin-bottom: 20px;
    }

    table {
      width: 600px;
      max-width: 100%;
      margin: 0 auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: center;
    }

    thead th {
      background: #e8e8e8;
    }

    tfoot td {
      background: #cfe0f5;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Shopping Bill</h1>

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Price (₹)</th>
        <th>Amount (₹)</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Notebook</td>
        <td>2</td>
        <td>50</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Pen</td>
        <td>5</td>
        <td>10</td>
        <td>50</td>
      </tr>
      <tr>
        <td>Book</td>
        <td>1</td>
        <td>200</td>
        <td>200</td>
      </tr>
      <tr>
        <td>Bag</td>
        <td>1</td>
        <td>500</td>
        <td>500</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="3">Total</td>
        <td>850</td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
